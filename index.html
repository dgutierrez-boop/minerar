function inferirTipoDesdeDescripcion(desc) {
if (!desc) return 'condicion';
const d = desc.toLowerCase().trim();
const palabrasActo = ['falta de uso','no uso','no usa','no utiliza','no lleva','incumplimiento','incumple','no cumple','no respet','no sigue','incorrecto','incorrecta','inadecuado','inadecuada','indebidamente','omitido','omitió','no realizó','no realiz','no hizo','manejo incorrecto','utilización inadecuada','uso inapropiado','conducción insegura','manejo inadecuado','velocidad excesiva','rutina mecánica','actividad mecánica','realizada en forma mecánica','evaluación de riesgos inadecuada','planificación inadecuada','falta de capacitación','transferencia inadecuada','operación fuera de parámetros','almacenamiento inadecuado'];
const palabrasCondicion = ['mal estado','en mal estado','dañado','dañada','deteriorado','deteriorada','deficiente','deficientes','inexistente','inexistentes','sin berma','falta berma','roto','rota','rotos','falla','fallas','averiado','averiada','falta de','ausente','ausentes','sin señal','sin cartel','contaminación','derrame','mancha','suelo sucio','visibilidad','polvo excesivo','niebla','deslumbramiento','fuera de estándar','fuera de estandar','no cumple estándar','ambiente inseguro','sector inseguro','condición insegura','orden deficiente','limpieza deficiente','desorden','señalización deficiente','señalizacion deficiente','cartel dañado','berma baja','berma inexistente','talud inestable'];
let scoreActo = 0, scoreCondicion = 0;
palabrasActo.forEach(p => { if (d.includes(p)) scoreActo++; });
palabrasCondicion.forEach(p => { if (d.includes(p)) scoreCondicion++; });
if (scoreActo > scoreCondicion) return 'acto';
if (scoreCondicion > scoreActo) return 'condicion';
const verbosAccion = ['no ','falta ','incumple','omitió','realizó','utilizó'];
for (const verbo of verbosAccion) { if (d.startsWith(verbo)) return 'acto'; }
return 'condicion';
}

function convertirEnlacesImagenes(urlString) {
if (!urlString || urlString.trim() === '') return [];
const urls = urlString.split(',').map(u => u.trim()).filter(u => u);
const imagenes = [];
urls.forEach(url => {
if (url.includes('drive.google.com')) {
const match = url.match(/[?&]id=([^&]+)/);
if (match && match[1]) imagenes.push({ thumbnail: `https://lh3.googleusercontent.com/d/${match[1]}=w800`, full: `https://drive.google.com/file/d/${match[1]}/view`, original: url });
} else if (url.startsWith('http')) { imagenes.push({ thumbnail: url, full: url, original: url }); }
});
return imagenes;
}

function parseCSV(text) { const lines=text.split('\n').filter(l=>l.trim()), r=[]; for(let i=1;i<lines.length;i++){ const line=lines[i],cols=[];let cur='',inq=false; for(let ch of line){if(ch==='"')inq=!inq;else if(ch===','&&!inq){cols.push(cur.trim());cur='';}else cur+=ch;} cols.push(cur.trim()); if(cols.length>=10)r.push(cols); } return r; }
function parseFecha(f) { if(!f) return {dia:'',mes:'',valido:false}; let s = f.toString().split(' ')[0].trim(), p = s.split('/'); if(p.length>=3) { let d=p[0].padStart(2,'0'), m=parseInt(p[1]), a=parseInt(p[2]); if(p[2].length===2) a=2000+a; if(m>=1 && m<=12 && a===2026) return {dia: d, mes: MESES_NOMBRES[m-1], valido: true}; } p = s.split('-'); if(p.length>=3) { let a=parseInt(p[0]), m=parseInt(p[1]), d=p[2].padStart(2,'0'); if(m>=1 && m<=12 && a===2026) return {dia: d, mes: MESES_NOMBRES[m-1], valido: true}; } return {dia:'',mes:'',valido:false}; }
function classifyData(desc, useVCP = false) {
if (!desc) return { id: 'orden', name: 'ORDEN, LIMPIEZA Y RESIDUOS', icon: '🧹', color: '#10b981' };
const d = desc.toLowerCase();
if (useVCP) {
if (d.includes('orden') || d.includes('limpieza') || d.includes('aceite')) return { id: 'orden', name: 'ORDEN, LIMPIEZA Y RESIDUOS', icon: '🧹', color: '#10b981' };
if (d.includes('procedimiento') || d.includes('bloqueo')) return { id: 'proc', name: 'PROCEDIMIENTOS', icon: '📋', color: '#f59e0b' };
if (d.includes('herramienta') || d.includes('equipo')) return { id: 'equip', name: 'EQUIPOS Y HERRAMIENTAS', icon: '🔧', color: '#8b5cf6' };
return { id: 'area', name: 'ÁREA Y ENTORNO', icon: '🏗️', color: '#ea580c' };
}
if (d.includes('berma') || d.includes('talud') || d.includes('borde')) return { id: 'berma', name: 'BERMA', icon: '🧱', color: '#f97316' };
if (d.includes('señal') || d.includes('cartel')) return { id: 'senalizacion', name: 'SEÑALIZACIÓN', icon: '🚸', color: '#06b6d4' };
if (d.includes('equipo') || d.includes('herramienta') || d.includes('maquinaria')) return { id: 'equipos', name: 'EQUIPOS Y HERRAMIENTAS', icon: '🔧', color: '#8b5cf6' };
if (d.includes('procedimiento') || d.includes('incumplimiento') || d.includes('bloqueo')) return { id: 'procedimientos', name: 'PROCEDIMIENTOS', icon: '📋', color: '#f59e0b' };
if (d.includes('epp') || d.includes('casco') || d.includes('guantes')) return { id: 'epp', name: 'FALTA EPP', icon: '🛡️', color: '#3b82f6' };
if (d.includes('residuo') || d.includes('basura') || d.includes('limpieza')) return { id: 'orden', name: 'ORDEN, LIMPIEZA Y RESIDUOS', icon: '🧹', color: '#10b981' };
if (d.includes('celular') || d.includes('velocidad') || d.includes('conducción')) return { id: 'conduccion', name: 'CONDUCCIÓN', icon: '🚗', color: '#ef4444' };
if (d.includes('visibilidad') || d.includes('polvo') || d.includes('área')) return { id: 'area', name: 'ÁREA Y ENTORNO', icon: '🏗️', color: '#ea580c' };
return { id: 'otros', name: 'OTROS', icon: '📌', color: '#6b7280' };
}
async function cargarDatosSucursal(sucursal) {
const config = SUCURSALES_CONFIG[sucursal]; let actosData = [], vcpData = [];
const hoy = new Date(), diaHoy = hoy.getDate().toString().padStart(2,'0'), mesHoy = MESES_NOMBRES[hoy.getMonth()];
if(config.actosUrl) {
try {
const r1 = await fetch(config.actosUrl + '&t=' + Date.now()), text = await r1.text(), rows = parseCSV(text);
for(let i=0; i<rows.length; i++) {
const row = rows[i]; let fecha, tipoRaw, sector, observador, desc, cerradoRaw;
if(sucursal === 'MALAGUENO' && i >= 225) {
const u = row[20] || ''; const uTrimmed = u.trim().toUpperCase();
if(uTrimmed.startsWith('AI-') || uTrimmed.startsWith('AI.') || uTrimmed.startsWith('AI ')) { tipoRaw='Acto Inseguro'; desc=u.replace(/^AI[\s\.\-]*/i,'').trim(); }
else if(uTrimmed.startsWith('CI-') || uTrimmed.startsWith('CI.') || uTrimmed.startsWith('CI ')) { tipoRaw='Condición Insegura'; desc=u.replace(/^CI[\s\.\-]*/i,'').trim(); }
else { tipoRaw=''; desc=u; }
fecha = row[11] || ''; observador = row[13] || ''; sector = row[14] || ''; cerradoRaw = row[23] || '';
} else {
if(row.length < Math.max(config.mapping.fecha, config.mapping.tipo, config.mapping.sector, config.mapping.observador, config.mapping.descripcion) + 1) continue;
fecha = row[config.mapping.fecha] || ''; tipoRaw = row[config.mapping.tipo] || ''; sector = row[config.mapping.sector] || ''; observador = row[config.mapping.observador] || ''; desc = row[config.mapping.descripcion] || ''; cerradoRaw = row[config.mapping.cerrado] || '';
}
let imagenUrls = []; for(let j=0; j<row.length; j++) { const cell = row[j] ? row[j].trim() : ''; if(cell && (cell.includes('drive.google.com') || cell.startsWith('http')) && !cell.includes('/spreadsheets/d/')) imagenUrls.push(cell); }
const fd = parseFecha(fecha); if(!fd.valido) continue;
let tipo = 'otro';
if(tipoRaw.toLowerCase().includes('acto')) tipo = 'acto'; else if(tipoRaw.toLowerCase().includes('condición') || tipoRaw.toLowerCase().includes('condicion')) tipo = 'condicion';
if(tipo === 'otro' && desc) { const descTrimmed = desc.trim().toUpperCase(); if(descTrimmed.startsWith('AI-') || descTrimmed.startsWith('AI.') || descTrimmed.startsWith('AI ')) { tipo = 'acto'; desc = desc.replace(/^AI[\s\.\-]*/i,'').trim(); } else if(descTrimmed.startsWith('CI-') || descTrimmed.startsWith('CI.') || descTrimmed.startsWith('CI ')) { tipo = 'condicion'; desc = desc.replace(/^CI[\s\.\-]*/i,'').trim(); } }
if(tipo === 'otro' && desc) tipo = inferirTipoDesdeDescripcion(desc);
let cerrado = false; if(cerradoRaw) { const cs = cerradoRaw.toString().toLowerCase().trim(); cerrado = cs === 'si' || cs === 'sí' || cs === 'true' || cs === '1' || cs === 'x'; }
actosData.push({ fecha, tipo, sector: (sector || '').toLowerCase().trim(), observador: (observador || '').trim(), descripcion: (desc || '').trim(), cerrado, mes: fd.mes, dia: fd.dia, categoria: classifyData(desc, false), sucursal: sucursal, imagen: imagenUrls.join(',') });
if(fd.dia === diaHoy && fd.mes === mesHoy) {
const idUnico = `${observador}|${desc}|${sector}|${fecha}`;
if(!reportesNotificadosActos.has(idUnico)) {
reportesNotificadosActos.add(idUnico);
const hora = fecha.split(' ')[1] || hoy.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
todayAlertsBySucursal[sucursal].actos.unshift({persona:observador, tipo:tipo==='acto'?'⚠️ ACTO':'🏚️ COND', descripcion:desc, sector, hora, timestamp:Date.now(), sucursal:sucursal});
updatePulseBadges(); updateRealTimeUI(); showNewReportAlert(observador, sector, desc, tipo==='acto'?'Acto Inseguro':'Condición Insegura', hora);
}
}
}
} catch(e) { console.error("Error cargando actos:", e); }
}
if(config.showVCP && config.vcpUrl) {
try {
const r2 = await fetch(config.vcpUrl + '&t=' + Date.now()), text2 = await r2.text(), rows2 = parseCSV(text2), vm = config.vcpMapping;
for(let i=0; i<rows2.length; i++) {
const row = rows2[i]; let fr, po, sec, des, com;
if(vm) { fr = row[vm.fecha] || ''; po = (row[vm.persona] || '').trim(); sec = row[vm.sector] || ''; des = row[vm.descripcion] || ''; com = row[vm.comentarios] || ''; }
else { fr = row[2] || ''; po = (row[1] || '').trim(); sec = (row[3] || '').toLowerCase().trim() || 'general'; des = row[32] || ''; com = row[28] || ''; }
let imagenUrlsVCP = []; for(let j=0; j<row.length; j++) { const cell = row[j] ? row[j].trim() : ''; if(cell && (cell.includes('drive.google.com') || cell.startsWith('http')) && !cell.includes('/spreadsheets/d/')) imagenUrlsVCP.push(cell); }
const fd = parseFecha(fr.split(' ')[0]); if(!fd.valido || !po) continue;
vcpData.push({ fecha: fr, tipo: 'vcp', sector: sec, personaObservada: po, descripcion: des, comentarios: com, cerrado: true, mes: fd.mes, dia: fd.dia, categoria: classifyData(des, true), sucursal: sucursal, imagen: imagenUrlsVCP.join(',') });
if(fd.dia === diaHoy && fd.mes === mesHoy) {
const idUnico = `${po}|${des}|${sec}|${fr}`;
if(!reportesNotificadosVCP.has(idUnico)) {
reportesNotificadosVCP.add(idUnico);
const hora = fr.split(' ')[1] || hoy.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
todayAlertsBySucursal[sucursal].vcp.unshift({persona:po, tipo:'🎯 VCP', descripcion:des, sector:sec, hora, timestamp:Date.now(), sucursal:sucursal});
updatePulseBadges(); updateRealTimeUI(); showNewReportAlert(po, sec, des, 'VCP', hora);
}

function normalizarNombre(nombre) { if (!nombre) return ''; return nombre.toLowerCase().trim().replace(/,/g, ' ').replace(/\./g, '').replace(/\s+/g, ' ').split(' ').sort().join(' '); }
function compararNombres(nombre1, nombre2) {
if (!nombre1 || !nombre2) return false;
const n1 = normalizarNombre(nombre1), n2 = normalizarNombre(nombre2);
if (n1 === n2 || n1.includes(n2) || n2.includes(n1)) return true;
const p1 = n1.split(' '), p2 = n2.split(' '); let coincidencias = 0;
for (const a of p1) { if (a.length < 2) continue; for (const b of p2) { if (b.length < 2) continue; if (a === b || a.includes(b) || b.includes(a)) { coincidencias++; break; } } }
return coincidencias >= Math.max(2, Math.floor(Math.min(p1.length, p2.length) * 0.8));
}

const supervisoresUnicos = Array.from(nombreNormalizadoMap.values()).sort();

function applyAllFilters() {
  const dataActos = ACTOS_COND_DATA.filter(e => {
    if (state.mes !== 'todo' && e.mes !== state.mes) return false;
    if (state.sector !== 'general' && !e.sector.includes(state.sector)) return false;
    if (state.estado === 'cerrados' && e.cerrado !== true) return false;
    if (state.estado === 'abiertos' && e.cerrado !== false) return false;
    if (selectedCausa && selectedCausa !== 'todas' && e.categoria?.id !== selectedCausa) return false;
    return true;
  });
  updateCategoryCards(dataActos, 'actos');
  updateChartsDona(dataActos, 'actos');
  updateTrendChart(dataActos);
  renderGeneralTable(ordenarPorFecha(dataActos));
  applyVCPFilters();
}
function applyVCPFilters() {
  let data = VCP_DATA;
  if (state.vcpMes !== 'todo') data = data.filter(e => e.mes === state.vcpMes);
  if (state.vcpSector !== 'general') data = data.filter(e => e.sector.includes(state.vcpSector));

  if (selectedVCPCausa && selectedVCPCausa !== 'todas') data = data.filter(e => e.categoria?.id === selectedVCPCausa);
  updateCategoryCards(data, 'vcp');
  updateVCPCharts(data);
}

function setVCPSector(sector, btn) { state.vcpSector = sector; document.querySelectorAll('#vcpSectorButtons .btn-filter').forEach(b => b.classList.remove('active')); btn.classList.add('active'); applyVCPFilters(); }
function setStatusVCP(status, btn) { state.vcpEstado = status; document.querySelectorAll('#vcpStatusButtons .btn-filter').forEach(b => b.classList.remove('active')); btn.classList.add('active'); applyVCPFilters(); }
function cambiarSucursal(suc) {
  currentSucursal = suc;
  document.querySelectorAll('.sucursal-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn' + suc.charAt(0) + suc.slice(1).toLowerCase())?.classList.add('active');
  updateSupervisorCard(); loadData();
}
function toggleVCPVisibility(show) { const section = document.getElementById('vcpSection'); if (section) section.style.display = show ? 'block' : 'none'; }
function actualizarObjetivosUI() {
  const config = SUCURSALES_CONFIG[currentSucursal];
  document.getElementById('objetivosTitulo').innerHTML = `📊 OBJETIVOS MENSUALES ACTOS Y CONDICIONES (${config.objetivos.actos + config.objetivos.cond})`;
  document.getElementById('objetivosMeta').innerHTML = `Meta: ${config.objetivos.actos} Actos + ${config.objetivos.cond} Condiciones = ${config.objetivos.actos + config.objetivos.cond} Total`;
  document.getElementById('objetivoActosTexto').innerHTML = `🎯 Objetivo: ${config.objetivos.actos}`;
  document.getElementById('objetivoCondicionesTexto').innerHTML = `🎯 Objetivo: ${config.objetivos.cond}`;
  const actos = ACTOS_COND_DATA.filter(e => e.tipo === 'acto').length;
  const cond = ACTOS_COND_DATA.filter(e => e.tipo === 'condicion').length;
  const total = ACTOS_COND_DATA.length;
  document.getElementById('kpiActos').innerText = actos;
  document.getElementById('kpiCondiciones').innerText = cond;
  const actosPct = Math.min(Math.round(actos / config.objetivos.actos * 100), 100);
  const condPct = Math.min(Math.round(cond / config.objetivos.cond * 100), 100);
  document.getElementById('actosBar').style.width = actosPct + '%';
  document.getElementById('condBar').style.width = condPct + '%';
  document.getElementById('actosPctLabel').innerText = actosPct + '%';
  document.getElementById('condPctLabel').innerText = condPct + '%';
  document.getElementById('actosStatus').innerText = actosPct >= 100 ? '✅ Cumplido' : '⚠️ Pendiente';
  document.getElementById('actosStatus').className = 'status-badge ' + (actosPct >= 100 ? 'status-ok' : 'status-warn');
  document.getElementById('condStatus').innerText = condPct >= 100 ? '✅ Cumplido' : '⚠️ Pendiente';
  document.getElementById('condStatus').className = 'status-badge ' + (condPct >= 100 ? 'status-ok' : 'status-warn');
  document.getElementById('vcpCurrent').innerText = VCP_DATA.length;
  const vcpPct = Math.min(Math.round(VCP_DATA.length / OBJ_VCP * 100), 100);
  document.getElementById('vcpBar').style.width = vcpPct + '%';
  document.getElementById('vcpPctLabel').innerText = vcpPct + '%';
  document.getElementById('vcpStatus').innerText = vcpPct >= 100 ? '✅ Cumplido' : '⚠️ Pendiente';
  document.getElementById('vcpStatus').className = 'status-badge ' + (vcpPct >= 100 ? 'status-ok' : 'status-warn');
}
function renderGeneralTable(data) {
  const tbody = document.getElementById('generalTableBody');
  if (!tbody) return;
  if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="text-center p-4 text-slate-400">No hay datos para mostrar</td></tr>'; return; }
  tbody.innerHTML = data.map((d, i) => {
    const hoy = new Date();
    const esHoy = (parseInt(d.dia) === hoy.getDate()) && (d.mes === MESES_NOMBRES[hoy.getMonth()]);
    return `<tr onclick="openReportModal(${i})" class="${esHoy ? 'row-hoy' : ''} border-b hover:bg-orange-50 transition-all">
      <td class="p-2">${d.dia}/${d.mes}</td>
      <td>${d.tipo === 'acto' ? '⚠️ Acto' : '🏚️ Condición'}</td>
      <td>${escapeHtml(d.observador)}</td>
      <td class="max-w-[200px] truncate">${escapeHtml(d.descripcion)}</td>
      <td>${getEstadoBadgeHTML(d.cerrado, 'small')}</td>
    </tr>`;
  }).join('');
  window.datosModalActual = data;
}
function openReportModal(index) {
  const data = window.datosModalActual;
  if (!data || !data[index]) return;
  currentModalData = data; currentModalIndex = index;
  const d = data[index];
  const content = document.getElementById('reportModalContent');
  if (!content) return;
  content.innerHTML = `
    <div class="flex justify-between items-center border-b pb-2">
      <h3 class="font-bold text-lg text-slate-800">${d.tipo === 'acto' ? '⚠️ Acto Inseguro' : '🏚️ Condición Insegura'}</h3>
      ${getEstadoBadgeHTML(d.cerrado)}
    </div>
    <div class="grid grid-cols-2 gap-2 text-xs">
      <div><span class="font-bold">📅 Fecha:</span> ${d.dia}/${d.mes}</div>
      <div><span class="font-bold">🏭 Sector:</span> ${d.sector || 'N/A'}</div>
      <div class="col-span-2"><span class="font-bold">👤 Observador:</span> ${escapeHtml(d.observador)}</div>
      <div class="col-span-2"><span class="font-bold">📝 Descripción:</span> ${escapeHtml(d.descripcion)}</div>
    </div>
    ${renderizarImagenesModal(d.imagen, "📷 REGISTRO FOTOGRÁFICO")}
  `;
  document.getElementById('modalCounter').innerText = (index + 1) + '/' + data.length;
  document.getElementById('btnPrev').disabled = index === 0;
  document.getElementById('btnNext').disabled = index === data.length - 1;
  document.getElementById('reportDetailModal').classList.remove('hidden-section');
  document.getElementById('reportDetailModal').style.display = 'flex';
  isModalOpen = true;
}
function goToPreviousModal() { if (currentModalIndex > 0) openReportModal(currentModalIndex - 1); }
function goToNextModal() { if (currentModalIndex < currentModalData.length - 1) openReportModal(currentModalIndex + 1); }
function closeReportModal() { document.getElementById('reportDetailModal').classList.add('hidden-section'); document.getElementById('reportDetailModal').style.display = 'none'; isModalOpen = false; }

// Para asegurar que el gráfico se actualice al cambiar el tamaño de la ventana
window.addEventListener('resize', () => {
  if (trendChart) trendChart.resize();
});
</script>
