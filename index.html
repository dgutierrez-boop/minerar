<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerar 2026 - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            border: 2px solid #fbbf24;
        }
        .lock-icon { font-size: 64px; margin-bottom: 16px; }
        .password-input { 
            width: 100%; 
            padding: 14px 16px; 
            border: 2px solid #e2e8f0; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 600; 
            margin: 20px 0; 
            text-align: center; 
            letter-spacing: 2px;
        }
        .password-input:focus { 
            outline: none; 
            border-color: #fbbf24; 
            box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.2); 
        }
        .login-btn { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #f59e0b, #d97706); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.2s; 
        }
        .login-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4); 
        }
        .error-msg { 
            color: #ef4444; 
            font-size: 14px; 
            font-weight: 600; 
            margin-top: 12px; 
            min-height: 20px; 
        }
    </style>
</head>
<body>

<div id="loginContainer">
    <div class="login-card">
        <div class="lock-icon">🔐</div>
        <h1 class="text-2xl font-black text-slate-800 mb-2">ACCESO RESTRINGIDO</h1>
        <p class="text-sm text-slate-500 mb-6">Panel de Seguridad Minerar 2026</p>
        
        <input type="password" id="passwordInput" class="password-input" placeholder="Ingrese contraseña..." autocomplete="off">
        
        <button onclick="verifyPassword()" class="login-btn">🔓 DESBLOQUEAR PANEL</button>
        
        <div id="passwordError" class="error-msg"></div>
        
        <p class="text-xs text-slate-400 mt-4">💡 Contraseña: MasAgiles@MINERAR</p>
    </div>
</div>

<div id="mainContent" style="display:none;">
    <h1 style="color:white; text-align:center; padding:40px;">¡BIENVENIDO AL PANEL!</h1>
</div>

<script>
// ==================== CONFIGURACIÓN ====================
const PASSWORD_CORRECTA = "MasAgiles@MINERAR";
let isUnlocked = false;

console.log('✅ Script cargado correctamente');
console.log('Password configurada:', PASSWORD_CORRECTA ? 'Sí' : 'No');

// ==================== FUNCIÓN DE LOGIN ====================
function verifyPassword() {
    console.log('🔐 Intentando ingresar...');
    
    const input = document.getElementById('passwordInput');
    const errorDiv = document.getElementById('passwordError');
    const loginContainer = document.getElementById('loginContainer');
    const mainContent = document.getElementById('mainContent');
    
    if (!input) {
        console.error('❌ No se encontró el input de contraseña');
        alert('Error: No se encontró el campo de contraseña');
        return;
    }
    
    const passwordIngresada = input.value;
    console.log('Contraseña ingresada:', passwordIngresada);
    console.log('Contraseña correcta:', PASSWORD_CORRECTA);
    
    if (passwordIngresada === PASSWORD_CORRECTA) {
        console.log('✅ Contraseña correcta - Acceso concedido');
        
        // Guardar en localStorage
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('currentUser', 'admin');
        
        // Mostrar mensaje de éxito
        errorDiv.style.color = '#22c55e';
        errorDiv.textContent = '✅ ¡ACCESO CONCEDIDO! Redirigiendo...';
        
        // Ocultar login y mostrar contenido principal
        setTimeout(() => {
            loginContainer.style.display = 'none';
            mainContent.style.display = 'block';
            isUnlocked = true;
            
            // Aquí cargarías el resto del panel
            console.log('🎉 Panel desbloqueado');
        }, 1000);
        
    } else {
        console.log('❌ Contraseña incorrecta');
        errorDiv.style.color = '#ef4444';
        errorDiv.textContent = '🔒 Contraseña incorrecta. Intente nuevamente.';
        input.value = '';
        input.focus();
        
        // Animación de error
        input.style.borderColor = '#ef4444';
        setTimeout(() => {
            input.style.borderColor = '#e2e8f0';
        }, 500);
    }
}

// ==================== EVENT LISTENERS ====================
window.addEventListener('load', function() {
    console.log('🚀 Página cargada');
    
    // Verificar si ya está logueado
    const isLoggedIn = localStorage.getItem('isLoggedIn');
    console.log('isLoggedIn:', isLoggedIn);
    
    if (isLoggedIn === 'true') {
        console.log('✅ Usuario ya logueado');
        document.getElementById('loginContainer').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        isUnlocked = true;
    } else {
        // Enfocar el input
        const input = document.getElementById('passwordInput');
        if (input) {
            input.focus();
            console.log('👁️ Input enfocado');
        }
    }
    
    // Permitir Enter para ingresar
    const input = document.getElementById('passwordInput');
    if (input) {
        input.addEventListener('keypress', function(e) {
            console.log('Tecla presionada:', e.key);
            if (e.key === 'Enter') {
                console.log('Enter presionado');
                verifyPassword();
            }
        });
    }
});

// Función para limpiar login
function logout() {
    localStorage.clear();
    location.reload();
}
</script>

</body>
</html>
