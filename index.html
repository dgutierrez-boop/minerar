<!-- 🔐 PANTALLA DE ACCESO POR CONTRASEÑA -->
<div id="passwordOverlay">
    <div class="password-card">
        <div class="password-lock-icon">🔐</div>
        <h2 class="text-xl font-black text-slate-800 mb-2">ACCESO RESTRINGIDO</h2>
        <p class="text-sm text-slate-500 mb-4">Panel de Seguridad Minerar 2026</p>
        
        <!-- Contenedor del input con botón de ver -->
        <div class="relative">
            <input type="password" id="passwordInput" class="password-input pr-12" placeholder="Ingrese contraseña..." autocomplete="off">
            <button type="button" id="togglePasswordBtn" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-amber-600 transition-colors p-1 rounded focus:outline-none focus:ring-2 focus:ring-amber-400" aria-label="Mostrar contraseña" title="Mostrar/Ocultar contraseña">
                <span id="eyeIcon" class="text-xl">👁️</span>
            </button>
        </div>
        
        <button onclick="verifyPassword()" class="password-btn">🔓 DESBLOQUEAR PANEL</button>
        
        <div id="passwordError" class="password-error"></div>
        
        <p class="password-hint">💡 Contraseña: <code class="bg-slate-100 px-1.5 py-0.5 rounded text-[10px]">MasAgiles@MINERAR</code> <span class="text-amber-600 font-bold">(solo para demo)</span></p>
    </div>
</div>
