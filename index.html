<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Minerar 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 p-4">
<div class="max-w-6xl mx-auto">
    <div class="bg-white p-6 rounded-lg shadow mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold">DASHBOARD SEGURIDAD MINERAR 2026</h1>
            <p class="text-green-600 text-sm">● SISTEMA ACTIVO</p>
        </div>
        <div class="bg-slate-100 p-4 rounded text-center">
            <div class="text-xs text-slate-500">REGISTROS</div>
            <div id="totalRecords" class="text-3xl font-bold">...</div>
        </div>
    </div>

    <div class="grid grid-cols-4 gap-4 mb-6">
        <div class="bg-white p-4 rounded-lg shadow border-l-4 border-cyan-500">
            <div class="text-sm font-bold text-cyan-600">ACTOS</div>
            <div id="kpiActos" class="text-4xl font-bold text-cyan-600">0</div>
        </div>
        <div class="bg-white p-4 rounded-lg shadow border-l-4 border-orange-500">
            <div class="text-sm font-bold text-orange-600">CONDICIONES</div>
            <div id="kpiCondiciones" class="text-4xl font-bold text-orange-600">0</div>
        </div>
        <div class="bg-white p-4 rounded-lg shadow border-l-4 border-pink-500">
            <div class="text-sm font-bold text-pink-600">VCP</div>
            <div id="kpiVCP" class="text-4xl font-bold text-pink-600">0</div>
        </div>
        <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-600">
            <div class="text-sm font-bold text-blue-600">CRÍTICOS</div>
            <div id="kpiCriticos" class="text-4xl font-bold text-blue-600">0</div>
        </div>
    </div>

    <div class="grid grid-cols-4 gap-6">
        <div class="bg-white p-4 rounded-lg shadow">
            <h3 class="font-bold mb-4">FILTROS</h3>
            <select id="monthFilter" onchange="applyFilters()" class="w-full p-2 border rounded mb-4">
                <option value="todo">Todo 2026</option>
                <option value="enero">Enero</option>
                <option value="febrero">Febrero</option>
                <option value="marzo">Marzo</option>
                <option value="abril">Abril</option>
            </select>
            <button onclick="setSector('general')" id="btn-general" class="btn-filter w-full p-2 mb-2 bg-blue-600 text-white rounded">GENERAL</button>
            <button onclick="setSector('cantera')" id="btn-cantera" class="btn-filter w-full p-2 mb-2 bg-gray-100 rounded">CANTERA</button>
            <button onclick="setSector('taller')" id="btn-taller" class="btn-filter w-full p-2 bg-gray-100 rounded">TALLER</button>
            
            <div id="championCard" class="mt-6 bg-gradient-to-r from-yellow-200 to-yellow-400 p-4 rounded border-2 border-yellow-500">
                <div class="text-xs font-bold bg-yellow-500 text-white inline-block px-2 py-1 rounded">CAMPEÓN</div>
                <h3 id="leaderName" class="text-xl font-bold mt-2">--</h3>
                <div class="text-3xl font-bold text-amber-700"><span id="leaderCount">0</span> <span class="text-sm">REPORTES</span></div>
            </div>
        </div>

        <div class="col-span-3 bg-white p-4 rounded-lg shadow">
            <h3 class="font-bold mb-4">EVOLUCIÓN MENSUAL</h3>
            <div class="h-64"><canvas id="trendChart"></canvas></div>
        </div>
    </div>
</div>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRR8W95m-mhfP6rwrZ7kHvdWl69IoIBA6S_V7ZIcBSt-Eb40gFMOn59R9QHLZ0tPZW_yQuefCP_U57_/pub?gid=0&single=true&output=csv';
let DB_ENTRIES = [], trendChart;
let state = { mes: 'todo', sector: 'general' };

async function loadData() {
    try {
        const res = await fetch(SHEET_URL);
        const csv = await res.text();
        const lines = csv.split('\n').filter(l => l.trim());
        DB_ENTRIES = [];
        
        for(let i=1; i<lines.length; i++) {
            const cols = lines[i].split(',');
            if(cols.length > 5 && cols[5]) {
                const fecha = cols[3] || '';
                const partes = fecha.split('/');
                const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
                let mesIdx = parseInt(partes[1]) - 1;
                if(isNaN(mesIdx) || mesIdx < 0) mesIdx = 2;
                
                DB_ENTRIES.push({
                    mes: meses[mesIdx] || 'marzo',
                    tipo: (cols[1]||'').toLowerCase().includes('acto') ? 'acto' : 'condicion',
                    sector: (cols[2]||'').toLowerCase(),
                    observador: cols[5].trim(),
                    descripcion: cols[6] || '',
                    cerrado: (cols[8]||'').toLowerCase().includes('sí') || (cols[8]||'').toLowerCase().includes('si')
                });
            }
        }
        document.getElementById('totalRecords').textContent = DB_ENTRIES.length;
        applyFilters();
    } catch(e) { 
        console.error(e); 
        document.getElementById('totalRecords').textContent = 'Error'; 
    }
}

function applyFilters() {
    const m = document.getElementById('monthFilter').value;
    const s = state.sector;
    
    const filtered = DB_ENTRIES.filter(e => {
        const matchMes = (m === 'todo' || e.mes === m);
        const matchSector = (s === 'general' || e.sector.includes(s));
        return matchMes && matchSector;
    });
    
    const actos = filtered.filter(e=>e.tipo==='acto');
    const cond = filtered.filter(e=>e.tipo==='condicion');
    
    document.getElementById('kpiActos').textContent = actos.length;
    document.getElementById('kpiCondiciones').textContent = cond.length;
    document.getElementById('kpiVCP').textContent = Math.round(filtered.length * 0.3);
    document.getElementById('kpiCriticos').textContent = filtered.filter(e=>e.descripcion.toLowerCase().includes('alto')).length;
    
    const rank = {};
    filtered.forEach(e => rank[e.observador] = (rank[e.observador]||0)+1);
    const sorted = Object.entries(rank).sort((a,b)=>b[1]-a[1]);
    
    if(sorted.length) { 
        document.getElementById('leaderName').textContent = sorted[0][0]; 
        document.getElementById('leaderCount').textContent = sorted[0][1]; 
    }
    
    updateChart(filtered);
}

function setSector(s) {
    state.sector = s;
    ['general','cantera','taller'].forEach(sec => {
        const btn = document.getElementById('btn-'+sec);
        if(sec === s) {
            btn.className = 'btn-filter w-full p-2 mb-2 bg-blue-600 text-white rounded';
        } else {
            btn.className = 'btn-filter w-full p-2 mb-2 bg-gray-100 rounded';
        }
    });
    applyFilters();
}

function updateChart(data) {
    const meses = ['enero','febrero','marzo','abril'];
    const actosData = meses.map(m=>data.filter(e=>e.mes===m && e.tipo==='acto').length);
    const condData = meses.map(m=>data.filter(e=>e.mes===m && e.tipo==='condicion').length);
    
    if(!trendChart) {
        trendChart = new Chart(document.getElementById('trendChart'), {
            type: 'line',
             { labels: meses, datasets: [
                {label:'Actos', [], borderColor:'#2563eb', fill:true, backgroundColor:'rgba(37,99,235,0.1)'},
                {label:'Condiciones', [], borderColor:'#f97316', borderDash:[5,5]}
            ]},
            options: { responsive: true }
        });
    }
    trendChart.data.datasets[0].data = actosData;
    trendChart.data.datasets[1].data = condData;
    trendChart.update();
}

window.onload = loadData;
</script>
</body>
</html>
